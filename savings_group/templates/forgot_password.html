<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-container">
    <h1 class="brand-title">Ubumwe Saving Group</h1>
    <h2>Forgot Password</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message" style="{% if category == 'danger' %}background-color: #dc3545;{% elif category == 'info' %}background-color: #17a2b8;{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <input type="email" name="email" placeholder="Enter your email" required>
      <button class="login-button" type="submit">Request Reset Link</button>
      <div style="margin-top: 15px;">
        <a href="{{ url_for('login') }}" style="color: #fff; text-decoration: none; font-size: 14px;">Back to Login</a>
      </div>
    </form>
  </div>
</body>
</html>
